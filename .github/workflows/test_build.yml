name: Test Single Region Build

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region name to build (e.g., belarus, poland-mazowieckie, us-texas)'
        required: true
        default: 'belarus'

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool zip wget jq curl
          pip install -r requirements.txt

      - name: Make build script executable
        run: chmod +x build_region.sh

      - name: Build Map for ${{ github.event.inputs.region }}
        run: ./build_region.sh ${{ github.event.inputs.region }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-build-${{ github.event.inputs.region }}
          path: ${{ github.event.inputs.region }}_dtg1_map.zip
          retention-days: 7