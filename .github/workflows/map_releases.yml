name: Compile and Publish Regional Maps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v2.1.0-maps)'
        required: true
        default: 'latest-maps'
  schedule:
    - cron: '0 0 1 * *'

jobs:
  # Задача 1: Чтение текстового файла и формирование динамической матрицы
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.set-regions.outputs.regions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse regions.txt
        id: set-regions
        run: |
          # Фильтруем пустые строки и комментарии, пакуем в JSON-массив через jq
          REGIONS_JSON=$(grep -v '^[[:space:]]*$' regions.txt | grep -v '^#' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Discovered regions: $REGIONS_JSON"
          echo "regions=$REGIONS_JSON" >> $GITHUB_OUTPUT

  # Задача 2: Параллельная сборка карт на основе полученной матрицы
  build-maps:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.prepare-matrix.outputs.regions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool zip wget jq curl
          pip install -r requirements.txt

      - name: Make build script executable
        run: chmod +x build_region.sh

      - name: Build Map binaries for ${{ matrix.region }}
        run: ./build_region.sh ${{ matrix.region }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}-map-archive
          path: ${{ matrix.region }}_dtg1_map.zip
          retention-days: 1

# Задача 3: Публикация релиза (Rolling Release: перезапись файлов)
  publish-release:
    needs: build-maps
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all Map Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./map_archives
          merge-multiple: true

      - name: Publish to GitHub Releases (Overwrite)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest-maps"
          name: "Offline Maps Update (Latest)"
          body: "Pre-compiled offline maps for DT NO.1 G1 (ATS3085S) smartwatches. These files are automatically re-generated every month from the newest OpenStreetMap data."
          files: ./map_archives/*.zip
          make_latest: false